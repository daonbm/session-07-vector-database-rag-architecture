plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    set('springAiVersion', "1.0.0-M6")
}

dependencies {
    // Web Starter cho REST API & Static UI
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Spring AI Starters: OpenAI / OpenRouter & Ollama (Local)
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'
    implementation 'org.springframework.ai:spring-ai-ollama-spring-boot-starter'

    // Spring AI Vector Store Starter: PGVector (PostgreSQL Vector Extension)
    implementation 'org.springframework.ai:spring-ai-pgvector-store-spring-boot-starter'

    // Document Reader để đọc và parse tài liệu (Markdown, PDF, Text, Docx...)
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'

    // PostgreSQL JDBC Driver để kết nối Supabase / PostgreSQL database
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'


    // Unit Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
